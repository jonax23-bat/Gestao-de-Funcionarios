name: gestao-funcionarios

services:
  # 1. Banco de Dados PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: postgres_funcionarios
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-empresa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-empresa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # 2. Backend REST API (Node.js + Express)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend_funcionarios
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-empresa_db}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # 3. Frontend SPA (Vite + React + Nginx Glassmorphism)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend_funcionarios
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
